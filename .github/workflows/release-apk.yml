# Build and publish the fork release APK
#
# Trigger: push a tag (e.g. 2025.1.3-v1.0) or run manually with a tag name.
# Signing material lives in keystore/ (see keystore/keystore.properties).

name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example 2025.1.3-v1.0)"
        required: true
        default: "2025.1.3-v1.0"

  push:
    tags:
      - "20*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with sora-editor submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure signing
        run: |
          set -a
          . keystore/keystore.properties
          set +a

          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/$storeFile"
            echo "KEYSTORE_PASSWORD=$storePassword"
            echo "KEY_ALIAS=$keyAlias"
            echo "KEY_PASSWORD=$keyPassword"
          } >> local.properties

      - name: Build release
        run: |
          chmod +x gradlew

          MEM_GB=$(free -g | awk '/^Mem:/{print $2}')
          WORKERS=4
          if [ "$MEM_GB" -lt 12 ]; then WORKERS=2; fi

          echo "Tag: $TAG  Memory: ${MEM_GB}GB  Workers: $WORKERS"
          ./gradlew ":app:assembleFossRelease" \
            --no-configuration-cache \
            --max-workers="$WORKERS" \
            --stacktrace \
            -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/foss/release -name "app-foss-release.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          cp "$APK" "Squircle-CE-$TAG.apk"
          ls -lh "Squircle-CE-$TAG.apk"
          echo "APK_NAME=Squircle-CE-$TAG.apk" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          "$APKSIGNER" verify --print-certs "$APK_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          Fork build based on the official 2025.1.3 release.

          Changes over upstream:
          - separate applicationId (com.blacksquircle.ui.forkbyfox), installs alongside the official app
          - hide the built-in local workspace from the sidebar (Settings - Files)
          - confirm before extracting an archive, ask for a password on encrypted archives
          - Chinese translation fixes
          EOF
          )

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "Squircle CE $TAG" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.tag || github.ref_name }}-apk
          path: Squircle-CE-${{ inputs.tag || github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30
