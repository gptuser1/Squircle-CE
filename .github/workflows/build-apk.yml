# Build Squircle CE APK
#
# Notes:
#   - Manual runs can pick a variant (fossDebug / gmsDebug / fossRelease / gmsRelease)
#   - Automatic push/PR builds are disabled on purpose; trigger the workflow manually when needed
#   - Release variants need repo secrets: KEYSTORE_FILE (base64) / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   - Public repo: 4 vCPU / 16 GB RAM, free and unmetered
#   - Private repo: 2 vCPU / 8 GB RAM, counted against the 2000 min/month quota

name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "fossDebug"
        type: choice
        options:
          - fossDebug
          - gmsDebug
          - fossRelease
          - gmsRelease

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VARIANT: ${{ inputs.variant || 'fossDebug' }}

jobs:
  build:
    name: ${{ inputs.variant || 'fossDebug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with sora-editor submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner only has 14 GB of SSD and Android builds fill it up fast
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /usr/share/swift
          sudo apt-get clean
          df -h /

      # The image ships an SDK, but compileSdk 36 is not guaranteed to be installed
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure signing (Release only)
        if: endsWith(env.VARIANT, 'Release')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secrets.KEYSTORE_FILE, cannot build a Release variant"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "KEYSTORE_PATH=keystore.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      - name: Build
        run: |
          chmod +x gradlew
          TASK="assemble${VARIANT^}"

          # Private runners only have 8 GB of RAM, lower the parallelism to avoid OOM kills
          MEM_GB=$(free -g | awk '/^Mem:/{print $2}')
          WORKERS=4
          if [ "$MEM_GB" -lt 12 ]; then WORKERS=2; fi

          echo "Variant: $VARIANT  Task: $TASK  Memory: ${MEM_GB}GB  Workers: $WORKERS"
          ./gradlew ":app:$TASK" \
            --no-configuration-cache \
            --max-workers="$WORKERS" \
            --stacktrace \
            -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Write build summary
        if: always()
        run: |
          {
            echo "### Build result"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Variant | \`$VARIANT\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| JDK | 17 (temurin) |"
            echo "| Disk | $(df -h / | awk 'NR==2{print $3" / "$2}') |"
          } >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name "*.apk" -exec sh -c '
            for f do
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "- \`$(basename "$f")\` $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            done' sh {} +

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.variant || 'fossDebug' }}-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing files
        if: always() && endsWith(env.VARIANT, 'Release')
        run: rm -f app/keystore.jks local.properties
